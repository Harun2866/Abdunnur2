<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>আমার ওয়েবসাইট</title>

    <!-- ২. CSS কোড লিখতে হয় <style> ট্যাগের ভেতরে অথবা আলাদা ফাইলে লিংকিং করতে হয় -->
    <style>
        body {
            background-color: #f4f4f4;
            color: #333;
        }
        h1 {
            color: maroon;
        }
    </style>
</head>
<body>

    <!-- ১. HTML কাঠামোগত ট্যাগ -->
    <h1>স্বাগতম আমার ওয়েবসাইটে</h1>
    <p>এটি একটি সাধারণ প্যারাগ্রাফ।</p>
    <button id="myBtn">ক্লিক করুন</button>

    <!-- ৩. JavaScript কোড লিখতে হয় সবার শেষে <script> ট্যাগের ভেতরে -->
    <script>
        document.getElementById("myBtn").onclick = function() {
            alert("আপনাকে ধন্যবাদ!");
        };
    </script>

</body>
</html>
